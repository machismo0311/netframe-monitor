# nfm-smart policy for Jarvis. Deploy to /etc/netframe/nfm-smart.conf (root:root 0644).
#
# Measured 2026-10-09 (read-only): /dev/sdh is the Dell IDSDM dual-SD module (USB 413c:a101).
# smartctl cannot identify its bridge without -d; with -d sat the mandatory SMART command fails,
# and with -d scsi it prints a meaningless "SMART Health Status: OK". It has no SMART to read, so
# it is declared here and reported explicitly as no SMART instead of being polled.
# The plain path works for the SATA disk behind this host's SAS3008 (unlike QuarkyLab), so the
# default MEGARAID_SATA_PATH=direct is kept.
NO_SMART_USB=413c:a101
