# nfm-smart policy for QuarkyLab. Deploy to /etc/netframe/nfm-smart.conf (root:root 0644).
#
# Measured 2026-10-09 (read-only): on this PERC (LSI SAS3008, megaraid_sas) the SATA drives at
# 0:0:{0,1,3,4,5,6}:0 fail SMART RETURN STATUS on the plain /dev/sdX path with DID_BAD_TARGET
# (1546 kernel FAILED lines in 24h, from the monitor, smartmon and smartd). The passthrough path
# /dev/bus/0 -d sat+megaraid,N returns the same attributes with no kernel error. Neither path can
# return the drive's own self-assessment ("ATA return descriptor not supported by controller
# firmware"), so these six drives read UNKNOWN/STATUS_UNSUPPORTED, by design, until that changes.
# The SAS drives (sdc, sdh) stay on the plain path, which returns their health status.
MEGARAID_SATA_PATH=passthrough
