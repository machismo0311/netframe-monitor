# PROPOSAL, SOURCE ONLY, not installed.
# Target: <node>:/etc/systemd/system/prometheus-node-exporter-smartmon.service.d/10-netframe-canonical.conf
# (root:root 0644), then `systemctl daemon-reload`. No restart is needed: the unit is a oneshot
# fired by prometheus-node-exporter-smartmon.timer every 15 minutes and picks this up on its next run.
#
# Replaces only the device list. The packaged collector polls everything `smartctl --scan-open`
# returns, which behind megaraid_sas is every disk twice: /dev/sdX (on QuarkyLab that path fails
# SMART RETURN STATUS with DID_BAD_TARGET on every run) and /dev/bus/0 -d [sat+]megaraid,N.
# The canonical copy reads `nfm-smart --targets` instead, the same selection the monitor uses.
[Service]
ExecStart=
ExecStart=/bin/sh -o pipefail -c "/usr/local/share/netframe/smartmon-canonical.sh | sponge /var/lib/prometheus/node-exporter/smartmon.prom"
