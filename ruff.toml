# Lint contract for netframe-monitor.
#
# Why this file exists: CI runs `ruff check .` after an unpinned
# `pip install ruff`, so with no config in the repo the enforced rule set was
# whatever the newest ruff happened to default to. A ruff release could
# therefore fail this repo without a single line of its code changing. That is
# what happened on 2026-08-04, and CI stayed red through 2026-09-27.
#
# The damage was wider than a red badge. The ruff step runs ahead of
# py_compile and pytest inside the same job, so an aborted job meant the test
# suite stopped executing entirely for that window, including for the commits
# that landed on 2026-09-26 and 2026-09-27.
#
# The set below is the one this code was written and kept green against:
#   E4  imports
#   E7  statement-level mistakes
#   E9  syntax and IO errors
#   F   pyflakes: undefined names, unused imports, broken f-strings
# The repo has zero findings across these. The 222 findings ruff 0.16.9
# reported all come from rule families that were never opted into (UP031,
# SIM115, EXE001, RUF100, PLW1510 and others). Widening the set is a
# deliberate decision to take on its own merits, not one a version bump
# should make on our behalf.
#
# Follow-up, needs a token with `workflow` scope: pin ruff in
# .github/workflows/ci.yml and give the py_compile and pytest steps
# `if: always()`, so a future lint failure cannot hide the tests again.

[lint]
select = ["E4", "E7", "E9", "F"]
